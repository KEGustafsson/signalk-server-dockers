name: Sync workflow_dispatch inputs from build-matrix.json

# Keeps the per-(OS x Node) checkboxes in the build workflows in lockstep with
# .github/build-matrix.json so the JSON is the single source of truth.
#
# Always runs the generator in --check mode and fails if the committed YAML
# differs from what build-matrix.json produces. Fix a failure by running
#
#     node .github/scripts/sync-dispatch-inputs.mjs
#
# locally and committing the regenerated workflows.
#
# The job deliberately does not auto-commit: pushes made with the default
# GITHUB_TOKEN are rejected for any file under .github/workflows/ ("refusing to
# allow a GitHub App to create or update workflow ... without `workflows`
# permission"), and that is not something the `permissions:` block can grant.

on:
  push:
    branches: [main]
    paths:
      - '.github/build-matrix.json'
      - '.github/scripts/sync-dispatch-inputs.mjs'
      - '.github/workflows/build sk docker container all.yml'
      - '.github/workflows/build sk docker container 24h.yml'
      - '.github/workflows/build docker base container all.yml'
      - '.github/workflows/sync-dispatch-inputs.yml'
  pull_request:
    paths:
      - '.github/build-matrix.json'
      - '.github/scripts/sync-dispatch-inputs.mjs'
      - '.github/workflows/build sk docker container all.yml'
      - '.github/workflows/build sk docker container 24h.yml'
      - '.github/workflows/build docker base container all.yml'
      - '.github/workflows/sync-dispatch-inputs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Check dispatch inputs match build-matrix.json
        run: |
          set -euo pipefail
          if ! node .github/scripts/sync-dispatch-inputs.mjs --check; then
            echo "::error::Dispatch inputs are out of sync. Run 'node .github/scripts/sync-dispatch-inputs.mjs' and commit the regenerated workflows."
            exit 1
          fi
